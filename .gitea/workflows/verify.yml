name: verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify with job-local pnpm
        run: |
          tool_dir=$(mktemp -d)
          trap 'rm -rf "$tool_dir"' EXIT
          npm install --prefix "$tool_dir" pnpm@10.33.0
          printf '%s\n' '@subcult:registry=https://git.subcult.tv/api/packages/subculture-collective/npm/' > "$tool_dir/npmrc"
          NPM_CONFIG_USERCONFIG="$tool_dir/npmrc" PATH="$tool_dir/node_modules/.bin:$PATH" make verify

  image:
    name: Build and publish the frontend image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      IMAGE: git.subcult.tv/subculture-collective/chicago-labor-archive-web
    steps:
      - uses: actions/checkout@v4
      - name: Build the frontend image
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          auth_dir=$(mktemp -d)
          trap 'rm -rf "$auth_dir"' EXIT
          printf '%s\n' '@subcult:registry=https://git.subcult.tv/api/packages/subculture-collective/npm/' > "$auth_dir/npmrc"
          DOCKER_BUILDKIT=1 docker build -f deploy/frontend.Dockerfile --build-arg CORE_UPSTREAM=core:8080 --secret id=npmrc,src="$auth_dir/npmrc" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "org.opencontainers.image.source=https://git.subcult.tv/subculture-collective/chicago-labor-archive" \
            -t "$IMAGE:$GITHUB_SHA" .
          docker run --rm --network none --entrypoint nginx "$IMAGE:$GITHUB_SHA" -t
          docker tag "$IMAGE:$GITHUB_SHA" "fleet-deploy/chicago-labor-archive/web:$GITHUB_SHA"
      - name: Publish the verified main image
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          REGISTRY_PAT: ${{ secrets.REGISTRY_PAT }}
        run: |
          set -euo pipefail
          test -n "$REGISTRY_PAT"
          umask 077
          auth_dir=$(mktemp -d)
          trap 'rm -rf "$auth_dir"' EXIT
          export DOCKER_CONFIG="$auth_dir/docker"
          printf '%s' "$REGISTRY_PAT" | docker login git.subcult.tv --username subcult-agent --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"
          echo "published $(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA")"
      - name: Deploy to Almaz and verify the public HTML
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.HOMELAB_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.HOMELAB_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          umask 077
          deploy_dir=$(mktemp -d)
          trap 'rm -rf "$deploy_dir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$deploy_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$deploy_dir/known_hosts"
          unset DEPLOY_KEY DEPLOY_KNOWN_HOSTS
          # The forced command on Almaz accepts only status/receive/deploy/artifact for this site.
          ssh_args=(-F /dev/null -i "$deploy_dir/key" -o ControlPath=none -o ControlMaster=no -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$deploy_dir/known_hosts" -o ConnectTimeout=15 onnwee@10.0.0.200)
          ssh "${ssh_args[@]}" status
          # shellcheck disable=SC2029
          docker save "fleet-deploy/chicago-labor-archive/web:$GITHUB_SHA" | ssh "${ssh_args[@]}" "receive $GITHUB_SHA web"
          # shellcheck disable=SC2029
          ssh "${ssh_args[@]}" "deploy $GITHUB_SHA"
          # shellcheck disable=SC2029
          ssh "${ssh_args[@]}" "artifact $GITHUB_SHA web" > "$deploy_dir/artifact.json"
          expected=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["html_sha256"])' "$deploy_dir/artifact.json")
          curl --fail --silent --show-error --retry 4 --retry-all-errors --max-time 30 https://cla.subcult.tv/ > "$deploy_dir/live.html"
          test "$(sha256sum "$deploy_dir/live.html" | cut -d' ' -f1)" = "$expected"
          echo "Live HTML matches the image built from $GITHUB_SHA"
